# Codex Solidity - Default Configuration

target:
  # Path to Solidity file or project directory
  # path: ./contracts

compiler:
  # Solidity compiler version
  version: "0.8.19"
  # Enable optimizations
  optimize: true
  # Optimization runs
  runs: 200

network:
  # Target network context (mainnet, goerli, arbitrum, optimism, fork)
  name: mainnet

skills:
  # Core DeFi/Protocol skills
  reentrancy: true
  flash-loan: true
  access-control: true
  overflow: true
  pool-freeze: true
  oracle-manipulation: true
  front-running: true
  delegatecall: true
  self-destruct: true
  # Trail of Bits skills
  unchecked-returns: true
  shadowing: true
  pragma-bugs: true
  signature-malleability: true
  erc20-assumptions: true
  timestamp-dependence: true
  storage-pointer: true
  inheritance-order: true
  assembly-issues: true
  # DeFi/Protocol skills
  erc4626-vault: true
  read-only-reentrancy: true
  rounding-errors: true
  liquidation-attack: true
  proxy-upgrade: true
  amm-math: true
  reward-manipulation: true
  bridge-vulnerability: true
  donation-attack: true
  eip-2612-permit: true
  nft-reentrancy: true
  token-uri-manipulation: true
  soulbound-bypass: true
  l2-sequencer: true
  gas-griefing: true

reporting:
  formats:
    - html
    - md
    - json
  output_dir: ./audit-reports

# Scope
scope:
  # Only audit these contracts (empty = all)
  include: []
  # Skip these contracts
  exclude:
    - "mock_*"
    - "test_*"
    - "script_*"

# Impact estimation
impact:
  # Assume pool size for drain calculations (in ETH)
  default_pool_size_eth: 100
  # Flash loan borrow amount assumption
  flash_loan_amount_eth: 10000
